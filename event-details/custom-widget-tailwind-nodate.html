
{% for item in DataSet1 %}
<div class="text-left self-start max-w-none w-full">
    <header>
        <h2 class="text-6xl-regular text-neutral-900 mb-2">{{ item.title }}</h2>
    </header>
</div>

{% if item.description %}
    <div class="text-left self-start max-w-none w-full my-2">
        <div class="prose-neutral m-auto prose max-w-none">
            <p>{{ item.description | escape | newline_to_br }}</p>
        </div>
    </div>
{% endif %}
{% endfor %}
